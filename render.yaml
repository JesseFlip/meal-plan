# Render Blueprint — free backend hosting.
# https://render.com/docs/blueprint-spec
#
# In the Render dashboard: New + -> Blueprint -> select this repo.
# Render reads this file and creates the service below on the Free plan.
# After the first deploy, set DATABASE_URL to a Neon Postgres connection
# string (see DEPLOYMENT.md) — Render's free plan has no persistent disk,
# so SQLite would be wiped on every restart/redeploy.

services:
  - type: web
    name: fridgeplan-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PIN_AUTH_ENABLED
        value: "false"
      - key: PIN_SECRET
        sync: false
